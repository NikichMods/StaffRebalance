  <defs>
    <radialGradient id="smoke">
      <stop offset="0" stop-color="#161411" stop-opacity=".50"/>
      <stop offset=".7" stop-color="#161411" stop-opacity=".38"/>
      <stop offset=".92" stop-color="#141312" stop-opacity=".15"/>
      <stop offset="1" stop-color="#141312" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x2="0" y2="1">
      <stop offset=".05" stop-color="#161411" stop-opacity="0"/>
      <stop offset=".45" stop-color="#161411" stop-opacity=".32"/>
      <stop offset=".57" stop-color="#161411" stop-opacity=".34"/>
      <stop offset=".95" stop-color="#161411" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ends">
      <stop offset=".01" stop-color="white" stop-opacity="0"/>
      <stop offset=".09" stop-color="white"/>
      <stop offset=".91" stop-color="white"/>
      <stop offset=".99" stop-color="white" stop-opacity="0"/>
