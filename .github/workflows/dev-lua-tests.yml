name: Dev Lua 5.4 mock tests

on:
  push:
    branches:
      - 'dev/**'
    paths:
      - 'dev/**'
      - '.github/workflows/dev-lua-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lua54:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Parse dev Lua sources
        run: |
          luac5.4 -p dev/StaffRebalanceDev/Scripts/main.lua
          luac5.4 -p dev/StaffRebalanceDev/Scripts/StaffReserveHud.lua
          luac5.4 -p dev/StaffRebalanceDev/tests.lua
          luac5.4 -p dev/StaffRebalanceDev/hud_tests.lua
      - name: Run dev mock suite
        run: |
          lua5.4 dev/StaffRebalanceDev/tests.lua dev/StaffRebalanceDev/Scripts/main.lua
          lua5.4 dev/StaffRebalanceDev/hud_tests.lua dev/StaffRebalanceDev/Scripts/StaffReserveHud.lua
